
name: GNA Archive Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GNA archive diagnostic
        run: python test_gna_archive.py
